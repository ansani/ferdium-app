name: BuildTauriRelease
description: Build Ferdium with Tauri for release

inputs:
  install-args:
    description: Additional arguments for pnpm install
    required: false
    default: --frozen-lockfile
  build-args:
    description: Additional arguments for pnpm build
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Use Node.js specified in the '.nvmrc' file
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install node dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-args }}

    - name: Build Tauri release
      shell: bash
      run: pnpm build ${{ inputs.build-args }}
